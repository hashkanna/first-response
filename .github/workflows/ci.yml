name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  INVESTIGATOR_BACKEND: local
  REPAIR_BACKEND: authored
  VERIFICATION_BACKEND: local
  WAR_ROOM_ENABLE_SETUP: "0"
  GEMINI_API_KEY: ""
  GOOGLE_API_KEY: ""
  GOOGLE_GENAI_USE_VERTEXAI: "false"
  GOOGLE_GENAI_USE_ENTERPRISE: "false"

jobs:
  python:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Test without cloud providers
        run: python -m pytest -q
      - name: Validate development launcher
        run: bash -n scripts/dev.sh

  web:
    name: Node 22 tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci
      - name: Test event and API behavior
        run: npm test
      - name: Typecheck and build
        run: npm run build
